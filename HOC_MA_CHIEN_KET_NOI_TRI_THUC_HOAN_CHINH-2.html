.fighter{position:absolute;bottom:19px;width:90px;height:138px;transition:filter .25s;transform-origin:center bottom;z-index:3}#player{left:8%}#enemy{right:8%}.blocky{position:relative;width:82px;height:130px;margin:auto;filter:drop-shadow(0 7px 5px #0003)}

.damage{position:absolute;inset:0;pointer-events:none}.scratch{position:absolute;height:3px;background:#972e2e;border-radius:4px;opacity:0;transform:rotate(-20deg)}.s1{left:16px;top:30px;width:18px}.s2{right:5px;top:62px;width:23px}.s3{left:20px;top:82px;width:26px}.s4{right:18px;top:108px;width:20px}.fighter[data-dmg="1"] .s1,.fighter[data-dmg="2"] .s1,.fighter[data-dmg="3"] .s1,.fighter[data-dmg="4"] .s1,.fighter[data-dmg="5"] .s1,.fighter[data-dmg="6"] .s1,.fighter[data-dmg="7"] .s1,.fighter[data-dmg="8"] .s1,.fighter[data-dmg="9"] .s1{opacity:.65}.fighter[data-dmg="4"] .s2,.fighter[data-dmg="5"] .s2,.fighter[data-dmg="6"] .s2,.fighter[data-dmg="7"] .s2,.fighter[data-dmg="8"] .s2,.fighter[data-dmg="9"] .s2{opacity:.85}.fighter[data-dmg="6"] .s3,.fighter[data-dmg="7"] .s3,.fighter[data-dmg="8"] .s3,.fighter[data-dmg="9"] .s3{opacity:1}.fighter[data-dmg="8"] .s4,.fighter[data-dmg="9"] .s4{opacity:1}.fighter[data-dmg="7"]{filter:grayscale(.12)}.fighter[data-dmg="9"]{filter:grayscale(.4) contrast(.9)}
.attack-player{animation:pattack .68s cubic-bezier(.2,.7,.2,1)}.attack-enemy{animation:eattack .68s cubic-bezier(.2,.7,.2,1)}.hit{animation:hit .32s 2}.ko{animation:ko .75s forwards}@keyframes pattack{0%,100%{transform:translateX(0)}48%{transform:translateX(54vw) rotate(-5deg)}58%{transform:translateX(54vw) rotate(8deg)}}@keyframes eattack{0%,100%{transform:translateX(0)}48%{transform:translateX(-54vw) rotate(5deg)}58%{transform:translateX(-54vw) rotate(-8deg)}}@keyframes hit{50%{transform:translateX(9px) rotate(7deg);filter:brightness(1.35) saturate(.45)}}@keyframes ko{to{transform:rotate(82deg) translate(28px,20px);opacity:.5}}

<div class="wrap">

  </div>

    <div id="meta" class="qmeta"></div>
    <h2 id="q"></h2>
    <div id="answers" class="answers"></div>
    <p id="feedback" class="feedback"></p>
    <div id="source" class="source"></div>
  </div>
</div>

const KT = (() => {
  const seen = new Set();
  const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  const pick=a=>a[R(0,a.length-1)];
  const shuffle=a=>[...a].sort(()=>Math.random()-.5);
  const uniq=a=>[...new Set(a.map(String))];
  function makeMC(correct,distractors){
    let opts=uniq([correct,...shuffle(distractors)]);
    while(opts.length<4) opts.push(String((Number(correct)||R(1,20))+R(1,9)));
    opts=shuffle(opts.slice(0,4));
    return {options:opts,answerIndex:opts.indexOf(String(correct)),answer:String(correct)};
  }
  function item(lesson,mode,difficulty,q,correct,distractors,explanation){
    const m=makeMC(correct,distractors);
    return {
      id:`${lesson.grade}-${lesson.subject}-${lesson.lessonNo}-${mode}-${Date.now()}-${R(100,999)}`,
      grade:lesson.grade,subject:lesson.subject,lessonNo:lesson.lessonNo,lesson:lesson.lesson,title:lesson.title,
      difficulty,generator:mode,question:q,options:m.options,answerIndex:m.answerIndex,answer:m.answer,
      explanation,source:lesson.source,mappingStatus:lesson.mappingStatus
    };
  }
  function lessonNumber(lesson){ return Number(lesson.lessonNo)||0; }
  function difficultyFromMode(mode){
    const easy=["direct","word_identify","vocab","meaning","spelling","phonics","truefalse"];
    const hard=["multistep","challenge","reasoning","read_infer","mini_read","error","cloze"];
    return easy.includes(mode)?"Nhận biết":hard.includes(mode)?"Vận dụng":"Thông hiểu";
  }

  // ---------- Specialized: Grade 3 Math Lesson 5 ----------
  function table3(lesson,mode){
    let a=R(1,10), b=3, ans,q,ds,ex;
    switch(mode){
      case "direct":
        ans=3*a;q=`3 × ${a} = ?`;ds=[ans+3,ans-3,a+3,ans+1];ex=`Bảng nhân 3: 3 × ${a} = ${ans}.`;break;
      case "missing":

      case "compare":
        let c=R(1,10); ans=3*a>3*c?">":3*a<3*c?"<":"="; q=`Điền dấu: 3 × ${a} … 3 × ${c}`;ds=["<",">","=","≠"];ex=`Hai vế lần lượt là ${3*a} và ${3*c}.`;break;
      case "expression":
        ans=`3 × ${a}`;q=`Biểu thức nào có giá trị bằng ${3*a}?`;ds=[`${a} + 3`,`3 + ${a}`,`${3*a} ÷ 3`,`2 × ${a}`];ex=`${3*a} là ${a} nhóm, mỗi nhóm 3.`;break;
      case "truefalse":
        ans="Đúng";q=`Mệnh đề “${3*a} ÷ 3 = ${a}” là đúng hay sai?`;ds=["Sai","Không xác định","Chỉ đúng khi a = 3"];ex=`Phép chia là phép tính ngược của phép nhân.`;break;
      case "context":
        ans=3*a;q=`Có ${a} túi, mỗi túi 3 viên bi. Có tất cả bao nhiêu viên bi?`;ds=[ans+3,ans-3,a+3,a];ex=`${a} nhóm 3 viên: ${a} × 3 = ${ans}.`;break;
      case "inverse":
        ans=a;q=`Có ${3*a} chiếc kẹo chia đều vào 3 đĩa. Mỗi đĩa có bao nhiêu chiếc?`;ds=[3,a+3,Math.max(1,a-1),3*a];ex=`${3*a} ÷ 3 = ${a}.`;break;
      case "sequence":
        ans=3*(a+1);q=`Số tiếp theo trong dãy ${3*a}, ${3*(a+1)-3}, ${3*(a+1)} là?`;ds=[ans+3,ans-3,ans+1,ans+2];ex=`Dãy các bội của 3 tăng 3 đơn vị.`;break;
      case "placevalue":
        ans=3*a;q=`Kết quả của 3 × ${a} là số nào?`;ds=[3*(a+1),Math.max(0,3*(a-1)),a,30+a];ex=`Tính theo bảng nhân 3.`;break;
      case "rounding":
        ans=3*a;q=`Chọn kết quả chính xác của 3 × ${a}.`;ds=[ans+1,ans-1,ans+2,ans-2];ex=`Không cần làm tròn: kết quả chính xác là ${ans}.`;break;
      case "unit":
        ans=3*a;q=`Mỗi đoạn dây dài 3 cm. ${a} đoạn như vậy dài bao nhiêu cm?`;ds=[ans+3,ans-3,a,3+a];ex=`3 × ${a} = ${ans} cm.`;break;
      case "geometry":
        ans=3*a;q=`Có ${a} hình tam giác rời nhau, mỗi hình có 3 cạnh. Tổng số cạnh được đếm là?`;ds=[ans+3,ans-3,a+3,a];ex=`Mỗi hình 3 cạnh nên 3 × ${a} = ${ans}.`;break;
      case "time_money":
        ans=3*a;q=`Mỗi quyển vở giá 3 nghìn đồng. ${a} quyển giá bao nhiêu nghìn đồng?`;ds=[ans+3,ans-3,a,3+a];ex=`3 × ${a} = ${ans} nghìn đồng.`;break;
      case "find_error":
        ans=`3 × ${a} = ${3*a}`;q=`Bạn nào tính đúng?`;ds=[`3 × ${a} = ${3*a+3}`,`3 × ${a} = ${Math.max(0,3*a-3)}`,`3 × ${a} = ${a+3}`];ex=`Theo bảng nhân 3, kết quả đúng là ${3*a}.`;break;
      case "reasoning":
        ans=3*(a+1);q=`Biết 3 × ${a} = ${3*a}. Không tính lại từ đầu, 3 × ${a+1} bằng?`;ds=[3*a+1,3*a+2,3*a+6,3*a];ex=`Tăng thừa số thứ hai 1 đơn vị thì tích tăng 3.`;break;
      case "multistep":
        ans=3*a-3;q=`Có ${a} hộp, mỗi hộp 3 bút. Cho bạn 3 bút. Còn lại bao nhiêu bút?`;ds=[3*a,3*a+3,Math.max(0,3*a-6),a];ex=`Có ${3*a} bút, bớt 3 còn ${3*a-3}.`;break;
      case "table_data":
        ans=3*a;q=`Bảng cho biết mỗi bạn có 3 nhãn vở. ${a} bạn có tổng cộng bao nhiêu nhãn vở?`;ds=[ans+3,ans-3,a+3,3];ex=`3 nhãn × ${a} bạn = ${ans}.`;break;
      default:
        ans=a;q=`Số nào vừa là thương của ${3*a} ÷ 3 vừa là thừa số còn thiếu trong 3 × □ = ${3*a}?`;ds=[a+1,Math.max(1,a-1),3,3*a];ex=`Cả hai cách đều cho ${a}.`;
    }
    return item(lesson,mode,difficultyFromMode(mode),q,ans,ds,ex);
  }

  function mathGeneric(lesson,mode){
    const g=lesson.grade, title=lesson.title.toLowerCase();
    let a,b,ans,q,ds,ex;
    const max=[0,20,1000,100000,1000000,1000000][g];
    if(title.includes("nhân") || title.includes("bảng nhân")){
      let k=(title.match(/bảng nhân\s*(\d)/)||[])[1]; k=k?Number(k):R(2,9); a=R(1,10); ans=k*a;
      q=mode==="missing"?`${k} × □ = ${ans}. □ = ?`:mode==="context"?`Có ${a} nhóm, mỗi nhóm ${k} đồ vật. Có tất cả bao nhiêu?`:`${k} × ${a} = ?`;
      ds=[ans+k,Math.max(0,ans-k),a+k,a]; ex=`Dùng phép nhân ${k} × ${a} = ${ans}.`;
    } else if(title.includes("chia") || title.includes("bảng chia")){
      b=R(2,9); ans=R(1,10); a=b*ans; q=`${a} ÷ ${b} = ?`; ds=[ans+1,Math.max(1,ans-1),b,a]; ex=`${a} ÷ ${b} = ${ans}.`;
    } else if(title.includes("phân số")){
      let den=R(2,9), n=R(1,den-1); ans=`${n}/${den}`; q=`Phân số biểu thị ${n} phần trong ${den} phần bằng nhau là?`;
      ds=[`${den}/${n}`,`${n+1}/${den}`,`${n}/${den+1}`]; ex=`Tử số là ${n}, mẫu số là ${den}.`;
    } else if(title.includes("thập phân")){
      a=(R(10,999)/10).toFixed(1); b=(R(10,999)/10).toFixed(1);
      if(title.includes("so sánh")){ ans=Number(a)>Number(b)?">":Number(a)<Number(b)?"<":"="; q=`${a} … ${b}`; ds=["<",">","="]; ex=`So sánh phần nguyên rồi phần thập phân.`;}
      else { ans=(Number(a)+Number(b)).toFixed(1); q=`${a} + ${b} = ?`; ds=[(Number(ans)+1).toFixed(1),(Number(ans)-1).toFixed(1),String(Number(a)-Number(b))]; ex=`Đặt thẳng hàng dấu phẩy rồi cộng.`;}
    } else if(title.includes("diện tích")){
      a=R(2,20);b=R(2,20);ans=a*b;q=`Hình chữ nhật dài ${a} cm, rộng ${b} cm. Diện tích là?`;ds=[2*(a+b),a+b,a*b+2];ex=`S = ${a} × ${b} = ${ans} cm².`;
    } else if(title.includes("chu vi")){
      a=R(2,20);b=R(2,20);ans=2*(a+b);q=`Hình chữ nhật dài ${a} cm, rộng ${b} cm. Chu vi là?`;ds=[a*b,a+b,ans+2];ex=`P = (${a}+${b})×2 = ${ans} cm.`;
    } else if(title.includes("thời gian") || title.includes("đồng hồ")){
      a=R(1,10); b=R(0,5)*10; ans=a*60+b; q=`${a} giờ ${b} phút bằng bao nhiêu phút?`;ds=[a*60,ans+10,Math.max(0,ans-10)];ex=`${a} giờ = ${a*60} phút, cộng ${b} phút.`;
    } else if(title.includes("tiền")){
      a=R(2,9)*1000;b=R(1,5);ans=a*b;q=`Mỗi món giá ${a.toLocaleString("vi-VN")} đồng. ${b} món hết bao nhiêu đồng?`;ds=[ans+a,Math.max(0,ans-a),a+b];ex=`${a} × ${b} = ${ans} đồng.`;
    } else {
      a=R(0,Math.max(10,Math.floor(max*.4)));b=R(0,Math.max(10,Math.floor(max*.2)));
      if(title.includes("trừ")){ if(b>a)[a,b]=[b,a]; ans=a-b;q=`${a} − ${b} = ?`;ds=[ans+1,Math.max(0,ans-1),a+b];ex=`Thực hiện phép trừ được ${ans}.`;}
      else { ans=a+b;q=mode==="context"?`Mai có ${a} nhãn vở, được thêm ${b}. Mai có tất cả bao nhiêu?`:`${a} + ${b} = ?`;ds=[ans+1,Math.max(0,ans-1),Math.abs(a-b)];ex=`${a}+${b}=${ans}.`;}
    }
    return item(lesson,mode,difficultyFromMode(mode),q,ans,ds,ex);
  }

  const viLex={
    1:{n:["bà","mẹ","cá","gà","nhà","sách"],v:["đi","ăn","đọc","học"],a:["đẹp","ngoan","cao","vui"]},
    2:{n:["học sinh","cây bàng","quyển sách","con mèo"],v:["chạy","đọc","viết","hát"],a:["chăm chỉ","xanh","nhanh","hiền"]},
    3:{n:["dòng sông","mái trường","thầy giáo","cánh đồng"],v:["học","chạy","ngắm","chăm sóc"],a:["trong xanh","rộng","chăm chỉ","ấm áp"]},
    4:{n:["quê hương","ước mơ","nghệ sĩ","khu vườn"],v:["sáng tạo","khám phá","bảo vệ","quan sát"],a:["rực rỡ","dũng cảm","dịu dàng","yên tĩnh"]},
    5:{n:["trách nhiệm","thiên nhiên","tình bạn","tri thức"],v:["chia sẻ","giữ gìn","khám phá","cống hiến"],a:["bền bỉ","bao la","chân thành","quý giá"]}
  };
  function vietnamese(lesson,mode){
    const D=viLex[lesson.grade]; let ans,q,ds,ex;
    if(mode==="spelling"){ let pairs=[["nghỉ ngơi","ngỉ ngơi"],["chăm chỉ","chăm chĩ"],["sạch sẽ","sạch sẻ"],["kể chuyện","cể chuyện"]];let p=pick(pairs);ans=p[0];q="Từ/cụm từ nào viết đúng chính tả?";ds=[p[1],"xanh xẽ","nghỉ ngơ"];ex=`“${ans}” viết đúng chính tả.`;}
    else if(mode==="punctuation"){ans=".";q=`Chọn dấu thích hợp: “Em rất yêu mái trường của mình__”`;ds=["?","!",","];ex="Đây là câu kể, dùng dấu chấm.";}
    else if(mode==="word_identify"||mode==="word_class"){ans=pick(D.v);q="Từ nào dưới đây chỉ hoạt động?";ds=[...D.n,...D.a];ex=`“${ans}” chỉ hoạt động.`;}
    else if(mode==="syn_ant"){ans="buồn";q="Từ trái nghĩa với “vui” là?";ds=["vẻ","vui vẻ","nhanh"];ex="“Buồn” trái nghĩa với “vui”.";}
    else if(mode==="sentence_order"){ans="Em chăm chỉ học bài.";q="Câu nào được sắp xếp đúng?";ds=["Em học bài chăm chỉ em.","Chăm chỉ em bài học.","Học em chăm chỉ bài."];ex="Câu đúng có trật tự từ tự nhiên.";}
    else if(mode==="read_infer"||mode==="mini_read"){
      ans="Vì Nam muốn cây luôn xanh tốt.";q=`Đọc: “Chiều nào Nam cũng tưới cây trước sân. Mấy hôm nắng gắt, em còn lấy rơm phủ quanh gốc.” Vì sao Nam làm như vậy?`;
      ds=["Vì Nam muốn nhổ cây.","Vì Nam không thích nắng.","Vì Nam muốn sân trống."];ex="Các hành động cho thấy Nam chăm sóc cây.";
    } else if(mode==="main_idea"||mode==="title"){
      ans="Chăm sóc cây xanh";q=`Đọc: “Lan nhặt lá khô, tưới nước và bắt sâu cho luống hoa.” Nhan đề nào phù hợp nhất?`;
      ds=["Một buổi đi chợ","Trận bóng đá","Chiếc cặp mới"];ex="Đoạn văn tập trung vào việc chăm sóc cây.";
    } else if(mode==="subject_predicate"){
      ans=pick(D.n);let v=pick(D.v);q=`Trong câu “${ans} ${v} mỗi ngày.”, bộ phận trả lời câu hỏi Ai/Cái gì? là?`;ds=[v,"mỗi ngày",`${v} mỗi ngày`];ex=`“${ans}” là đối tượng được nói đến.`;
    } else {
      ans=pick(D.a);q="Từ nào dưới đây chỉ đặc điểm?";ds=[...D.n,...D.v];ex=`“${ans}” chỉ đặc điểm/tính chất.`;
    }
    return item(lesson,mode,difficultyFromMode(mode),q,ans,ds,ex);
  }

  const enBank={
    1:["book","ball","bike","bag","cat","dog","red","blue","mum","dad"],
    2:["cake","kite","sea","rainbow","classroom","kitchen","farm","zoo","shirt","home"],
    3:["hello","name","friend","body","hobby","school","book","colour","family","teacher","cat","toy","zoo"],
    4:["friend","Monday","birthday","swim","library","Maths","football","holiday","doctor","weather","city"],
    5:["city","house","country","hobby","teacher","classroom","picnic","family","healthy","bus","holiday"]
  };
  const mean={book:"quyển sách",ball:"quả bóng",bike:"xe đạp",bag:"cặp",cat:"con mèo",dog:"con chó",red:"màu đỏ",blue:"màu xanh",mum:"mẹ",dad:"bố",cake:"bánh",kite:"diều",sea:"biển",rainbow:"cầu vồng",classroom:"lớp học",kitchen:"nhà bếp",farm:"nông trại",zoo:"sở thú",shirt:"áo sơ mi",home:"nhà",hello:"xin chào",name:"tên",friend:"bạn",body:"cơ thể",hobby:"sở thích",school:"trường học",colour:"màu sắc",family:"gia đình",teacher:"giáo viên",toy:"đồ chơi",Monday:"thứ Hai",birthday:"sinh nhật",swim:"bơi",library:"thư viện",Maths:"môn Toán",football:"bóng đá",holiday:"kỳ nghỉ",doctor:"bác sĩ",weather:"thời tiết",city:"thành phố",house:"ngôi nhà",country:"quốc gia",picnic:"dã ngoại",healthy:"khỏe mạnh",bus:"xe buýt"};
  function english(lesson,mode){
    const words=enBank[lesson.grade], w=pick(words); let ans,q,ds,ex;
    if(mode==="vocab"||mode==="meaning"){ans=w;q=`Which word means “${mean[w]||w}”?`;ds=words.filter(x=>x!==w);ex=`“${w}” means “${mean[w]||w}”.`;}
    else if(mode==="spelling"){ans=w;q=`Choose the correctly spelt word for “${mean[w]||w}”.`;ds=[w.slice(0,-1)+"x",w+"e",w[0]+w];ex=`The correct spelling is “${w}”.`;}
    else if(mode==="pattern"||mode==="grammar"){ans=lesson.grade<=2?"This is my book.":lesson.grade===3?"I have a cat.":"I like playing football.";q="Choose the correct sentence.";ds=["This my book.","I likes a cat.","I like play footballs."];ex="This option follows the target sentence pattern.";}
    else if(mode==="reorder"){ans="I like my school.";q=`Reorder: “like / I / school / my”`;ds=["Like I school my.","I school like my.","My I like school."];ex="Correct order: subject + verb + object.";}
    else if(mode==="dialogue"||mode==="qa"){ans="I'm fine, thank you.";q=`A: How are you?  B: ___`;ds=["I'm a school.","It is Monday.","I have two."];ex="This is a natural reply to “How are you?”";}
    else if(mode==="odd_one"){ans="Monday";q="Choose the odd one out.";ds=["red","blue","green"];ex="Monday is a day; the others are colours.";}
    else if(mode==="read_infer"||mode==="cloze"){ans="school";q=`Nam is a pupil. He studies with his friends at ___.`;ds=["zoo","farm","shop"];ex="A pupil studies at school.";}
    else {ans="teacher";q="A person who teaches pupils is a ___.";ds=["doctor","cat","bus"];ex="A teacher teaches pupils.";}
    return item(lesson,mode,difficultyFromMode(mode),q,ans,ds,ex);
  }

  function lessons(filter={}){
    return KT_LESSONS.filter(x=>(!filter.grade||x.grade==filter.grade)&&(!filter.subject||x.subject===filter.subject));
  }
  function modesFor(lesson){ return KT_GENERATOR_MODES[lesson.subject]||[]; }
  function resolveLesson(filter={}){
    let arr=lessons(filter);
    if(filter.lessonNo) arr=arr.filter(x=>x.lessonNo==filter.lessonNo);
    if(filter.lesson) arr=arr.filter(x=>x.lesson===filter.lesson || x.title===filter.lesson);
    if(!arr.length) throw new Error("Không tìm thấy bài học phù hợp.");
    return pick(arr);
  }
  function generate(filter={}){
    const lesson=resolveLesson(filter);
    let modes=modesFor(lesson);
    if(filter.generator) modes=modes.filter(x=>x===filter.generator);
    if(filter.difficulty){
      modes=modes.filter(x=>difficultyFromMode(x)===filter.difficulty);
      if(!modes.length) modes=modesFor(lesson);
    }
    const mode=pick(modes);
    for(let tries=0;tries<100;tries++){
      let out;
      if(lesson.grade===3 && lesson.subject==="Toán" && lesson.lessonNo===5) out=table3(lesson,mode);
      else if(lesson.subject==="Toán") out=mathGeneric(lesson,mode);
      else if(lesson.subject==="Tiếng Việt") out=vietnamese(lesson,mode);
      else out=english(lesson,mode);
      const key=[out.grade,out.subject,out.lessonNo,out.generator,out.question,...out.options].join("|");
      if(!seen.has(key)){seen.add(key);return out;}
    }
    seen.clear(); return generate(filter);
  }
  function check(question,choiceIndex){
    const correct=Number(choiceIndex)===question.answerIndex;
    window.dispatchEvent(new CustomEvent(correct?"kt:correct":"kt:wrong",{detail:{question,choiceIndex}}));
    return correct;
  }
  function stats(){
    const by={}; for(const x of KT_LESSONS){const k=`${x.grade}-${x.subject}`;by[k]=(by[k]||0)+1;}
    return {lessons:KT_LESSONS.length,virtualTemplates:KT_LESSONS.reduce((n,x)=>n+(KT_GENERATOR_MODES[x.subject]?.length||0),0),by};
  }
  return {lessons:KT_LESSONS,generatorModes:KT_GENERATOR_MODES,listLessons:lessons,generate,check,stats,resetSeen:()=>seen.clear()};
})();
if(typeof window!=="undefined") window.KT=KT;

</script>
<script>
const $=id=>document.getElementById(id); let playerHP=10, enemyHP=10,current,busy=false,soundOn=true;
let audioCtx;
function ctx(){audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();return audioCtx}
function tone(freq,dur=.1,type="square",vol=.08,delay=0){if(!soundOn)return;const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur)}
function hitSound(){tone(150,.07,"square",.12);tone(85,.12,"sawtooth",.08,.05)}
function correctSound(){tone(523,.08,"sine",.07);tone(659,.08,"sine",.07,.09);tone(784,.13,"sine",.07,.18)}
function wrongSound(){tone(180,.12,"sawtooth",.08);tone(120,.18,"sawtooth",.07,.10)}
function victorySound(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,"triangle",.08,i*.14))}
function defeatSound(){[330,247,196,147].forEach((f,i)=>tone(f,.22,"sawtooth",.06,i*.16))}
function populateLessons(){
 const arr=KT.listLessons({grade:+$("grade").value,subject:$("subject").value});
 $("lesson").innerHTML=arr.map(x=>`<option value="${x.lessonNo}">${x.lesson}</option>`).join("");
 if(+$("grade").value===3&&$("subject").value==="Toán") $("lesson").value="5";
 next();
}
function hp(){
 $("php").style.width=playerHP*10+"%";$("ehp").style.width=enemyHP*10+"%";
 $("pt").textContent=`${playerHP}/10 HP`;$("et").textContent=`${enemyHP}/10 HP`;
 $("player").dataset.dmg=10-playerHP;$("enemy").dataset.dmg=10-enemyHP;
}
function next(){
 if(playerHP<=0||enemyHP<=0||busy)return;
 current=KT.generate({grade:+$("grade").value,subject:$("subject").value,lessonNo:+$("lesson").value,difficulty:$("difficulty").value||undefined});
 $("meta").innerHTML=`<span class="badge">Lớp ${current.grade}</span><span class="badge">${current.subject}</span><span class="badge">${current.difficulty}</span><span class="badge">${current.generator}</span><br>${current.lesson}`;
 $("q").textContent=current.question;$("feedback").textContent="";$("source").textContent="Nguồn căn cứ: "+current.source;
 $("answers").innerHTML=current.options.map((x,i)=>`<button onclick="answer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join("");
}
function showFx(icon){$("fx").textContent=icon;$("fx").classList.remove("show");void $("fx").offsetWidth;$("fx").classList.add("show")}
function animateAttack(attacker,target,cls,done){
 busy=true;attacker.classList.add(cls);setTimeout(()=>{hitSound();showFx("💥");target.classList.add("hit");navigator.vibrate?.(80);},330);
 setTimeout(()=>{attacker.classList.remove(cls);target.classList.remove("hit");busy=false;done&&done()},760);
}
function answer(i){
 if(busy)return; const ok=KT.check(current,i);
 [...$("answers").children].forEach(b=>b.disabled=true);
 if(ok){correctSound();$("feedback").textContent="✅ Chính xác! "+current.explanation;
  animateAttack($("player"),$("enemy"),"attack-player",()=>{enemyHP--;hp();finishOrNext()});
 }else{wrongSound();$("feedback").textContent=`❌ Chưa đúng. Đáp án: ${current.answer}. ${current.explanation}`;
  animateAttack($("enemy"),$("player"),"attack-enemy",()=>{playerHP--;hp();finishOrNext()});
 }
}
function finishOrNext(){
 if(enemyHP<=0){$("enemy").classList.add("ko");victorySound();showResult("🏆 CHIẾN THẮNG!","Bé đã hạ Boss Khối Vuông");}
 else if(playerHP<=0){$("player").classList.add("ko");defeatSound();showResult("💫 THỬ LẠI NÀO!","Ôn thêm bài này rồi tái đấu");}
 else setTimeout(next,450);
}
function showResult(big,small){$("result").innerHTML=`${big}<small>${small}</small><br><button onclick="restart()">Chơi lại</button>`;$("overlay").classList.add("show")}
function restart(){playerHP=enemyHP=10;busy=false;$("player").classList.remove("ko");$("enemy").classList.remove("ko");$("overlay").classList.remove("show");hp();next()}
$("grade").onchange=populateLessons;$("subject").onchange=populateLessons;$("lesson").onchange=next;$("difficulty").onchange=next;
$("soundBtn").onclick=()=>{soundOn=!soundOn;$("soundBtn").textContent=soundOn?"🔊":"🔇";$("soundBtn").setAttribute("aria-label",soundOn?"Tắt âm thanh":"Bật âm thanh");if(soundOn)tone(600,.07)}
hp();populateLessons();
</script>
